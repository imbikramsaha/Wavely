<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wavely — Prototype</title>
<link rel="stylesheet" href="wavely/tokens.css" />
<style>
  html, body { margin: 0; height: 100%; background: #06070a; }
  body { display: grid; place-items: center; min-height: 100vh;
    background:
      radial-gradient(60% 50% at 50% 0%, #11161f 0%, #06070a 60%);
    font-family: "Hanken Grotesk", system-ui, sans-serif; padding: 28px; }
  #root { transform-origin: center; }
  .hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #5c6675; font-size: 12.5px; font-weight: 600; letter-spacing: .01em; text-align: center; }
  .hint b { color: #8fa6c4; }
</style>
</head>
<body>
  <div id="root"></div>
  <div class="hint">Interactive prototype — tap the <b>mini-player</b> to expand · long-press a row to multi-select · open <b>Settings</b> to switch theme</div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="wavely/data.js"></script>
  <script type="text/babel" src="wavely/art.jsx"></script>
  <script type="text/babel" src="wavely/chrome.jsx"></script>
  <script type="text/babel" src="wavely/screens.jsx"></script>
  <script type="text/babel" src="wavely/overlays.jsx"></script>
  <script type="text/babel" src="wavely/app.jsx"></script>
  <script type="text/babel">
    function PrototypeRoot() {
      const app = useWavely();
      // fit to viewport height
      React.useEffect(() => {
        const fit = () => {
          const scale = Math.min(1, (window.innerHeight - 64) / 832, (window.innerWidth - 32) / 384);
          document.getElementById('root').style.transform = `scale(${scale})`;
        };
        fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
      }, []);
      return <WavelyApp app={app} />;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<PrototypeRoot />);
  </script>
</body>
</html>

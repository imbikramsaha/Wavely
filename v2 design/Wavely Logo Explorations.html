<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wavely — Logo Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Manrope", system-ui, sans-serif;
    background: #ECEEF3;
    color: #14151A;
    padding: 56px 32px 96px;
  }
  header { text-align: center; max-width: 640px; margin: 0 auto 48px; }
  header .eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; color: #8A8F9C; margin-bottom: 14px; }
  header h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  header p { margin-top: 10px; font-size: 15px; line-height: 1.55; color: #5C616E; font-weight: 500; }

  .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }

  .card {
    background: #fff; border-radius: 24px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(16,18,24,.06), 0 18px 40px -26px rgba(16,18,24,.45);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid #EDEFF3; }
  .card-head .meta { display: flex; flex-direction: column; gap: 3px; }
  .card-head .name { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .card-head .desc { font-size: 12.5px; font-weight: 600; color: #8A8F9C; }
  .pill { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: #F1F2F6; color: #6B7180; }
  .swatches { display: flex; gap: 6px; margin-top: 4px; }
  .swatches i { width: 13px; height: 13px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }

  .stages { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 640px){ .stages { grid-template-columns: 1fr; } }
  .stage { aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; }
  .stage.light { background: #fff; }
  .stage.dark  { background: #0B0B12; }
  .stage svg { width: 38%; height: auto; display: block; }
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Wavely · Color & Segment Study</div>
    <h1>Pieces &amp; palettes</h1>
    <p>Same five-bar peak, now broken into stacked segments with colour shifting across the mark — plus a few violet / pink / sunset directions to react to. Each shown on white and black.</p>
  </header>

  <div class="wrap" id="wrap"></div>

  <script>
  // ----- mark geometry -----
  const BARS = [40, 72, 110, 72, 40];      // small, little-big, big, little-big, small
  const X    = [0, 30, 60, 90, 120];
  const W = 16, CY = 65, VBW = 136, VBH = 130;

  // hex lerp helpers
  const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const rgb2hex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
  function rampColor(stops, t){
    t = Math.max(0, Math.min(1, t));
    const seg = t * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(seg));
    const f = seg - i;
    const a = hex2rgb(stops[i]), b = hex2rgb(stops[i+1]);
    return rgb2hex([0,1,2].map(k => a[k] + (b[k]-a[k]) * f));
  }

  // split a bar of height h into rounded segments
  function segmentsFor(h){
    const gap = 6;
    const n = Math.max(2, Math.round(h / 24));
    const segH = (h - gap*(n-1)) / n;
    const top = CY - h/2;
    const out = [];
    for (let i = 0; i < n; i++){
      out.push({ y: top + i*(segH+gap), h: segH });
    }
    return out;
  }

  // build one SVG mark. mode: 'solid' | 'segmented'
  function buildMark(palette, mode, uid){
    const svgns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgns, "svg");
    svg.setAttribute("viewBox", `0 0 ${VBW} ${VBH}`);

    if (mode === 'solid'){
      const defs = document.createElementNS(svgns, "defs");
      const grad = document.createElementNS(svgns, "linearGradient");
      grad.setAttribute("id", "g"+uid);
      grad.setAttribute("x1","0"); grad.setAttribute("y1","0");
      grad.setAttribute("x2","1"); grad.setAttribute("y2","0");
      palette.forEach((c, i) => {
        const s = document.createElementNS(svgns, "stop");
        s.setAttribute("offset", (i/(palette.length-1)*100)+"%");
        s.setAttribute("stop-color", c);
        grad.appendChild(s);
      });
      defs.appendChild(grad); svg.appendChild(defs);
      BARS.forEach((h, bi) => {
        const r = document.createElementNS(svgns, "rect");
        r.setAttribute("x", X[bi]); r.setAttribute("y", CY - h/2);
        r.setAttribute("width", W); r.setAttribute("height", h);
        r.setAttribute("rx", W/2); r.setAttribute("fill", `url(#g${uid})`);
        svg.appendChild(r);
      });
    } else {
      BARS.forEach((h, bi) => {
        const xnorm = X[bi] / X[X.length-1];      // 0..1 left→right
        segmentsFor(h).forEach(seg => {
          const ynorm = 1 - ((seg.y + seg.h/2) - (CY - 55)) / 110; // 0 bottom →1 top
          const t = 0.55*xnorm + 0.45*ynorm;       // diagonal colour flow
          const r = document.createElementNS(svgns, "rect");
          r.setAttribute("x", X[bi]); r.setAttribute("y", seg.y);
          r.setAttribute("width", W); r.setAttribute("height", seg.h);
          r.setAttribute("rx", Math.min(W/2, seg.h/2));
          r.setAttribute("fill", rampColor(palette, t));
          svg.appendChild(r);
        });
      });
    }
    return svg;
  }

  // ----- options -----
  const OPTIONS = [
    { name: "Aurora", desc: "Violet → pink, segmented", mode: "segmented", palette: ["#7C3AED","#A855F7","#EC4899","#F472B6"] },
    { name: "Aurora", desc: "Violet → pink, solid sweep", mode: "solid", palette: ["#7C3AED","#A855F7","#EC4899","#F472B6"] },
    { name: "Grape Soda", desc: "Indigo → violet → magenta, segmented", mode: "segmented", palette: ["#4F46E5","#7C3AED","#C026D3","#EC4899"] },
    { name: "Sunset", desc: "Rose → coral → amber, segmented", mode: "segmented", palette: ["#F43F5E","#FB7185","#FB923C","#FBBF24"] },
    { name: "Candy", desc: "Cyan → violet → pink mix, segmented", mode: "segmented", palette: ["#22D3EE","#6366F1","#A855F7","#EC4899"] },
    { name: "Magenta Pop", desc: "Magenta → fuchsia → violet, solid sweep", mode: "solid", palette: ["#DB2777","#D946EF","#A855F7"] },
  ];

  const wrap = document.getElementById("wrap");
  OPTIONS.forEach((o, idx) => {
    const card = document.createElement("div");
    card.className = "card";

    const sw = o.palette.map(c => `<i style="background:${c}"></i>`).join("");
    card.innerHTML = `
      <div class="card-head">
        <div class="meta">
          <span class="name">${o.name}</span>
          <span class="desc">${o.desc}</span>
          <span class="swatches">${sw}</span>
        </div>
        <span class="pill">${o.mode === 'segmented' ? 'Segmented' : 'Solid'}</span>
      </div>
      <div class="stages">
        <div class="stage light"></div>
        <div class="stage dark"></div>
      </div>`;

    card.querySelector(".stage.light").appendChild(buildMark(o.palette, o.mode, "L"+idx));
    card.querySelector(".stage.dark").appendChild(buildMark(o.palette, o.mode, "D"+idx));
    wrap.appendChild(card);
  });
  </script>
</body>
</html>
